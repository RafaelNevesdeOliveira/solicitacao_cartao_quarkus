# JDK 25.0.2. H2 é o padrão local; PostgreSQL é um perfil alternativo.
quarkus.http.port=${PORT:8082}
quarkus.http.host=127.0.0.1
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:cartoes;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;INIT=RUNSCRIPT FROM 'classpath:db/01_criar_tabelas.sql'
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.devservices.enabled=false
quarkus.compose.devservices.enabled=false

# Os mesmos scripts SQL idempotentes funcionam nos dois bancos e rodam no startup.
# Hibernate só mapeia entidades; não disputa a criação das tabelas com os scripts.
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.sql-load-script=no-file
app.database.init=true
app.h2.tcp.enabled=true
app.h2.tcp.port=9093

# PostgreSQL precisa estar iniciado e a DATABASE solicitacao_cartoes criada uma vez.
%postgres.quarkus.datasource.db-kind=postgresql
%postgres.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/solicitacao_cartoes}
%postgres.quarkus.datasource.username=${DB_USER:postgres}
%postgres.quarkus.datasource.password=${DB_PASSWORD:postgres}
%postgres.app.h2.tcp.enabled=false

# Testes sempre isolados do PostgreSQL e sem abrir porta TCP.
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:cartoes_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.app.h2.tcp.enabled=false

quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.smallrye-openapi.path=/openapi
quarkus.security.jaxrs.deny-unannotated-endpoints=true

# Chave PÚBLICA no sentido de estar no material de aula: não usar em produção.
# A chave de verificação jwt-secret.jwk contém os mesmos bytes codificados em Base64URL.
# Se trocar JWT_SECRET, fornecer também JWK correspondente por JWT_VERIFY_KEY_LOCATION.
security.jwt.secret=${JWT_SECRET:chave-exclusiva-didatica-cartoes-2026-trocar}
security.jwt.issuer=solicitacao-cartoes-api
security.jwt.expiration-seconds=900
security.password.bcrypt-cost=12
smallrye.jwt.verify.key.location=${JWT_VERIFY_KEY_LOCATION:jwt-secret.jwk}
smallrye.jwt.verify.algorithm=HS256
smallrye.jwt.new-token.signature-algorithm=HS256
mp.jwt.verify.issuer=${security.jwt.issuer}
mp.jwt.verify.clock.skew=0
quarkus.native.resources.includes=jwt-secret.jwk
